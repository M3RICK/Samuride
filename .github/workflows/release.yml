name: release

# Push a tag like v1.0 to publish downloadable Linux, Windows, macOS and Android builds on the Releases page
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notes:
    # The release description is the version's section of CHANGELOG.md: no patch notes, no release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Extract the patch notes
        run: tools/release_notes.sh "${{ github.ref_name }}" > notes.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md

  linux:
    # Built on Ubuntu 24.04: runs on any distro with glibc 2.39 or newer
    # The builds wait for the notes, and still run without them when started by hand
    needs: notes
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git \
            libx11-dev libxrandr-dev libxcursor-dev libxi-dev libudev-dev libgl1-mesa-dev \
            libfreetype-dev libharfbuzz-dev libflac-dev libvorbis-dev libogg-dev

      - name: Build the package
        run: tools/package_release.sh "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}"

      - uses: actions/upload-artifact@v4
        with:
          name: samuride-linux
          path: dist/*.tar.gz

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz

  windows:
    # Cross-compiled with MinGW, the same way tools/package_windows.sh is tested locally under Wine
    needs: notes
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the MinGW toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64-posix cmake git make zip

      - name: Build the package
        run: tools/package_windows.sh "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}"

      - uses: actions/upload-artifact@v4
        with:
          name: samuride-windows
          path: dist/*.zip

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip

  macos:
    # Apple Silicon runner; the package runs on macOS 13.3 or newer
    needs: notes
    if: ${{ !failure() && !cancelled() }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build the package
        run: tools/package_macos.sh "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}"

      - uses: actions/upload-artifact@v4
        with:
          name: samuride-macos
          path: dist/*.zip

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip

  android:
    # arm64 phones. Signed with the key in the ANDROID_KEYSTORE secret: an update only installs over
    # a build signed with the same key (see android/README.md)
    needs: notes
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The SDK, the NDK and SFML built for Android: half an hour of work, done once
      - uses: actions/cache@v4
        with:
          path: build/android/sdk
          key: android-sdk-${{ hashFiles('android/package.sh') }}

      - name: Use the signing key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          [ -n "$ANDROID_KEYSTORE" ] || { echo "The ANDROID_KEYSTORE secret is missing, see android/README.md"; exit 1; }
          mkdir -p build/android
          echo "$ANDROID_KEYSTORE" | base64 -d > build/android/debug.keystore

      - name: Build the APK
        run: android/package.sh "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}"

      - uses: actions/upload-artifact@v4
        with:
          name: samuride-android
          path: dist/*.apk

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
